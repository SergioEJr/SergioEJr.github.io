name: CI

# Quality gate for pull requests (and pushes to non-main branches): type-check
# and build before anything can be merged. Deploys are handled separately by
# deploy.yml on push to main.
on:
  pull_request:
  push:
    branches-ignore: [main]

# Read-only: this workflow never deploys or writes anything.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Format check (prettier)
        run: npm run format:check
      - name: Type-check (astro check)
        run: npm run check
      - name: Build
        run: npm run build
